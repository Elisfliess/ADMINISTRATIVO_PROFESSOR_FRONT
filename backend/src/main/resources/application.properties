spring.application.name=compasso-api
server.port=${PORT:8080}

# Carrega o .env local quando presente. Variáveis do sistema/IDE continuam tendo precedência.
spring.config.import=optional:file:.env[.properties]

# A conexão deve ser configurada pelo ambiente. Não há fallback para banco local ou produção.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Contrato: propriedades JSON desconhecidas são rejeitadas com 400.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Contrato de paginação: tamanho máximo aceito por página.
spring.data.web.pageable.max-page-size=100

# Sessão HTTP em memória (D-014/SDA-006): 30 minutos de inatividade, cookie HttpOnly.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true

# A autenticação é feita pelo fluxo próprio de /auth/login. Sem isso, o Spring
# Boot criaria um usuário "user" em memória e uma senha aleatória no log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# CORS: apenas origens explícitas, com credenciais. SameSite/domínio definitivos
# dependem da topologia de hospedagem do frontend (pendência registrada).
compasso.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Integração de e-mail. O provedor definitivo (Resend) ainda não foi integrado;
# o adaptador noop não envia mensagens e não registra tokens em log.
compasso.email.provider=${EMAIL_PROVIDER:noop}
compasso.email.remetente=${EMAIL_FROM:nao-responder@compasso.local}
compasso.app.url-publica=${APP_PUBLIC_URL:http://localhost:5173}

# Flyway mantém o schema versionado em src/main/resources/db/migration.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Apenas health e info ficam expostos via HTTP.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

info.app.name=Compasso API
info.app.description=API da plataforma Compasso
info.app.version=0.0.1-SNAPSHOT
